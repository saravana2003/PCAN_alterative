# Phase 2D - littlefs on Octo-SPI flash + batched CAN logger. Every symbol
# checked against the workspace before being added.
#
#   CONFIG_FLASH               -> drivers/flash/Kconfig
#   CONFIG_FLASH_MAP           -> subsys/storage/flash_map/Kconfig. Required by
#                                 CONFIG_FS_LITTLEFS_FMP_DEV (littlefs on flash).
#   CONFIG_FLASH_PAGE_LAYOUT   -> drivers/flash/Kconfig:169. "default
#                                 FLASH_HAS_PAGE_LAYOUT"; the OSPI-B NOR driver
#                                 selects FLASH_HAS_PAGE_LAYOUT so this is
#                                 effectively automatic - set explicitly.
#   CONFIG_FLASH_RENESAS_RA_OSPI_B -> drivers/flash/Kconfig.renesas_ra_ospi.
#                                 "default y" when the &s28hl512t node
#                                 (compatible renesas,ra-ospi-b-nor) is enabled
#                                 by the board. Implements erase/write/read +
#                                 page_layout for the S28HX512T.
#   CONFIG_FILE_SYSTEM / _LITTLEFS -> subsys/fs/Kconfig + Kconfig.littlefs.
#                                 LITTLEFS needs the modules/fs/littlefs module
#                                 (present in this workspace).
#   CONFIG_RING_BUFFER        -> lib/os/Kconfig. SRAM staging ring in flash_log.c.
#   CONFIG_MAIN_STACK_SIZE=8192 -> fs_dirent / fs_statvfs plus the 1 KiB drain
#                                 buffer used by flash_log_stop() on the main
#                                 thread (the littlefs sample uses 4096 with no
#                                 extra stack buffers).

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_RENESAS_RA_OSPI_B=y

CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y

CONFIG_RING_BUFFER=y

CONFIG_MAIN_STACK_SIZE=8192

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# TEMP (bring-up diagnostic): surface which step of the OSPI SPI-mode init
# fails - the reasons are LOG_DBG inside flash_renesas_ra_ospi_b.c.
CONFIG_FLASH_LOG_LEVEL_DBG=y
