# Phase 2E - on-chip Ethernet (static IP) + DoIP skeleton. Symbols checked
# against the workspace.
#
#   CONFIG_ETH_RENESAS_RA  -> drivers/ethernet/Kconfig.renesas_ra. "default y"
#        when &eth (compatible renesas,ra-ethernet) is enabled - it is, in the
#        stock ek_ra8d1.dts, together with &mdio and ethernet-phy@5.
#   CONFIG_NET_CONFIG_SETTINGS + NET_CONFIG_MY_IPV4_* -> subsys/net/lib/config.
#        Applies the static IPv4 address at boot (no DHCP), per the STATE.md
#        decision to use static addressing like real automotive networks.
#   zsock_* socket API from <zephyr/net/socket.h> (no CONFIG_POSIX_API needed).

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_RENESAS_RA=y

# Static IP (no DHCP). GW/DNS point at a typical bench router; adjust on site.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.50"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.1.1"

# Sockets / contexts (one UDP + one TCP listener + one accepted client).
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_NET_MAX_CONN=8
CONFIG_ZVFS_OPEN_MAX=8

# Packet / buffer pools.
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32

# TCP initial sequence number needs an entropy source (board has &trng).
CONFIG_ENTROPY_GENERATOR=y

CONFIG_MAIN_STACK_SIZE=2048

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_NET_LOG=y
