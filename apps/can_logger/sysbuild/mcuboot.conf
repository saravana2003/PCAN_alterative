# Image-specific Kconfig for the MCUboot bootloader image (sysbuild applies
# <app>/sysbuild/mcuboot.conf automatically, alongside mcuboot.overlay).
#
# The application hands uart9 (J-Link VCOM / COM12) over to raw CLP binary
# framing, so MCUboot must NOT print its banner / log lines there first — a
# host CLP parser would see ASCII garbage before the app takes over. COBS
# resyncs at the next 0x00 so it is only cosmetic, but a clean stream from
# byte 0 is worth two Kconfig lines. Debug of the boot path itself is via
# SEGGER RTT / a debugger, not this UART.

CONFIG_UART_CONSOLE=n
CONFIG_BOOT_BANNER=n
CONFIG_MCUBOOT_LOG_LEVEL_OFF=y
