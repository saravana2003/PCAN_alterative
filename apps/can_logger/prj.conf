# Phase 2A — CAN-FD module. Every symbol below was checked against the
# workspace before being added:
#   CONFIG_CAN                 -> drivers/can/Kconfig (menuconfig CAN)
#   CONFIG_CAN_FD_MODE         -> drivers/can/Kconfig:94
#   CONFIG_CAN_RENESAS_RA_CANFD-> drivers/can/Kconfig.renesas_ra (default y when
#                                 the canfd0 DT node is enabled; set explicitly
#                                 here so the dependency is visible)
#   CONFIG_LOG / _DEFAULT_LEVEL-> subsys/logging/Kconfig
#
# NOT enabled: CONFIG_CAN_RX_TIMESTAMP — the renesas,ra-canfd driver does not
# implement it (no reference in drivers/can/can_renesas_ra.c), so the
# hardware free-running-timer timestamp is unavailable on this SoC. Our
# module captures a software timestamp in the RX ISR callback instead.

CONFIG_CAN=y
CONFIG_CAN_FD_MODE=y
CONFIG_CAN_RENESAS_RA_CANFD=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
