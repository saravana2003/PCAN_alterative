# can_logger — integrated CAN-FD capture + CLP host link (Phase 5 follow-on).
#
# The Phase 2A CAN-FD module (can_iface.c) now feeds the Phase 2C CLP protocol
# (clp_proto.c, shared from apps/usb_cdc) over a UART transport (clp_uart.c).
# Live RX frames go to the host as CLP_MSG_CAN_RX; the host can request a
# transmit with CLP_MSG_CAN_TX. Every symbol below was checked against the
# workspace before being added.
#
#   CONFIG_CAN / _CAN_FD_MODE / _CAN_RENESAS_RA_CANFD -> drivers/can/Kconfig*
#        (unchanged from Phase 2A). NOT CONFIG_CAN_RX_TIMESTAMP — the
#        renesas,ra-canfd driver does not implement it; we software-timestamp
#        in the RX ISR (can_iface.c).
#   CONFIG_COBS   -> lib/utils/Kconfig  (COBS framing, <zephyr/data/cobs.h>)
#   CONFIG_CRC    -> subsys/crc/Kconfig (crc16_ccitt() for CLP CRC-16/X-25).
#        CONFIG_CRC_HW_HANDLER forced off — clp_proto.c uses the SW routine and
#        we don't want the on-chip CRC driver pulled in.
#   CONFIG_RING_BUFFER -> lib/os/Kconfig (tx/rx byte rings in clp_uart.c)
#   CONFIG_UART_INTERRUPT_DRIVEN -> drivers/serial/Kconfig; the uart9 driver is
#        renesas,ra8-uart-sci-b (uart_renesas_ra8_sci_b.c) which implements the
#        fifo_fill / irq_tx_ready / irq_rx_ready / irq_callback_set API.
#   CONFIG_POLL -> kernel/Kconfig (k_poll is not used; k_msgq + k_sem only).

CONFIG_CAN=y
CONFIG_CAN_FD_MODE=y
CONFIG_CAN_RENESAS_RA_CANFD=y

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y
CONFIG_COBS=y
CONFIG_CRC=y
CONFIG_CRC_HW_HANDLER=n

# --- COM12 (J-Link VCOM = uart9) is handed over to raw CLP binary framing ---
# The UART console driver and the UART log backend would both write ASCII onto
# the same wire and corrupt the CLP byte stream, so both are disabled. Zephyr
# logging + printk are routed to SEGGER RTT instead (view with J-Link RTT
# Viewer / `JLinkRTTClient`), which keeps a debug channel without touching COM12.
CONFIG_UART_CONSOLE=n
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
# Drop log records when no RTT viewer is draining the buffer (headless bench
# runs) instead of stalling on every message.
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y

# clp_uart.c encodes CLP frames (COBS + CRC, up to ~90 B) on the caller stack;
# the CAN RX ISR only does a k_msgq_put, so the heavy work is in threads. 4 KiB
# main stack matches the other apps and covers the boot-time HELLO encode.
CONFIG_MAIN_STACK_SIZE=4096
