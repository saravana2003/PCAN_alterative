# Phase 3 — sysbuild configuration for apps/can_logger.
# Only consumed when the app is built with `west build --sysbuild`; a plain
# `west build apps/can_logger` ignores this file and builds exactly as in
# Phase 2A (no bootloader, links at flash0 base 0x02000000).
#
# Every SB_CONFIG_* symbol below was checked against this checkout:
#   SB_CONFIG_BOOTLOADER_MCUBOOT            -> zephyr/share/sysbuild/images/bootloader/Kconfig
#   SB_CONFIG_MCUBOOT_MODE_OVERWRITE_ONLY   -> same file, choice MCUBOOT_MODE
#   SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256-> same file, choice BOOT_SIGNATURE_TYPE
#
# Mode = OVERWRITE_ONLY (not the sysbuild default SWAP_USING_OFFSET) because
# the RA8D1 on-chip code flash (flash0) has write-block-size = 128, and
# MCUboot's bootutil_public.h hard-asserts
#   MCUBOOT_BOOT_MAX_ALIGN >= 8 && <= 32   "for SWAP upgrade modes"
# (CONFIG_MCUBOOT_BOOT_MAX_ALIGN defaults to the chosen flash write-block-size
# -> 128 here). OVERWRITE_ONLY does not trip that assert. See STATE.md.

SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_OVERWRITE_ONLY=y

# ECDSA P-256 image signing: smaller verify code than RSA-2048 on Cortex-M85,
# and the private PEM that ships with the mcuboot module
# ($ZEPHYR_MCUBOOT_MODULE_DIR/root-ec-p256.pem) is used automatically until we
# supply our own key via SB_CONFIG_BOOT_SIGNATURE_KEY_FILE. This is the hook
# for a project signing key (see STATE.md "MCUboot / SecOC" note).
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
