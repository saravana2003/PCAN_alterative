# Phase 2B - GPIO buttons/LEDs + periodic timer. Each symbol checked against
# the workspace before being added:
#   CONFIG_GPIO                        -> drivers/gpio/Kconfig (also already y in
#                                        boards/renesas/ek_ra8d1/ek_ra8d1_defconfig)
#   CONFIG_RENESAS_RA_EXTERNAL_INTERRUPT
#        -> drivers/misc/renesas_ra_external_interrupt/Kconfig. "default y" once a
#           renesas,ra-external-interrupt node is enabled; the stock ek_ra8d1.dts
#           already enables &port_irq12 (P008/S2) and &port_irq13 (P009/S1), so
#           this is really redundant - set explicitly so the dependency is visible.
#           Without it the RA ioport driver returns -ENOTSUP for GPIO_INT_ENABLE
#           (gpio_renesas_ra_ioport.c:83).
#   CONFIG_LOG / CONFIG_LOG_DEFAULT_LEVEL -> subsys/logging/Kconfig
#
# The periodic timer (log_timer.c) uses the kernel k_timer API, which is always
# built in - no Kconfig needed. See log_timer.c for why k_timer over the on-chip
# AGT counter.

CONFIG_GPIO=y
CONFIG_RENESAS_RA_EXTERNAL_INTERRUPT=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
