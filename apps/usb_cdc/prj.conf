# Phase 2C - USB CDC-ACM + CLP framing. Every symbol checked against the
# workspace before being added.
#
#   CONFIG_USB_DEVICE_STACK_NEXT -> subsys/usb/device_next/Kconfig:5. The new
#        ("next") USB device stack - what zephyr/samples/subsys/usb/cdc_acm
#        uses. Pulls UDC_DRIVER; on this board UDC_RENESAS_RA
#        (drivers/usb/udc/Kconfig.renesas_ra) is "default y" because
#        &usbhs/zephyr_udc0 (compatible "renesas,ra-udc") is enabled by
#        boards/renesas/ek_ra8d1/ek_ra8d1.dts. High-Speed capable, so
#        USBD_MAX_SPEED defaults to High.
#   CONFIG_USBD_CDC_ACM_CLASS   -> subsys/usb/device_next/class/Kconfig.cdc_acm.
#        "default y" once a zephyr,cdc-acm-uart node exists (added in
#        boards/ek_ra8d1.overlay). Selects RING_BUFFER + UART_INTERRUPT_DRIVEN.
#        Set explicitly so the dependency is visible.
#   CONFIG_UART_LINE_CTRL       -> drivers/serial/Kconfig. Needed for the DTR
#        (host-opened-port) query in usb_link.c.
#   CONFIG_COBS                 -> lib/utils/Kconfig:94. COBS framing used by
#        clp_proto.c (<zephyr/data/cobs.h> streaming encoder/decoder).
#   CONFIG_CRC                  -> subsys/crc/Kconfig:7. Provides crc16_ccitt()
#        used for the CLP CRC-16/X-25. CONFIG_CRC_HW_HANDLER is forced off: the
#        board's on-chip CRC peripheral (chosen zephyr,crc = &crc) would pull
#        an extra driver we don't use - clp_proto.c calls the SW crc16_ccitt().
#   CONFIG_RING_BUFFER         -> lib/os/Kconfig. tx_rb in usb_link.c.
#   CONFIG_LOG                 -> subsys/logging/Kconfig.

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_RING_BUFFER=y

CONFIG_COBS=y
CONFIG_CRC=y
CONFIG_CRC_HW_HANDLER=n

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Quieten the USB stack's own logging (matches the cdc_acm sample).
CONFIG_USBD_LOG_LEVEL_ERR=y
CONFIG_UDC_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USBD_CDC_ACM_LOG_LEVEL_OFF=y
